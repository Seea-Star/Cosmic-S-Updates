<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Updates</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #F3EEDA;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .home-btn {
      background: #F3EEDA; 
      color: #111; 
      border: 2px solid #111; 
      padding: 8px 14px; 
      border-radius: 12px; 
      font-weight: 800; 
      font-size: 0.75rem; 
      text-decoration: none; 
      box-shadow: 2px 2px 0px #111;
      transition: transform 0.1s ease;
    }

    .home-btn:hover {
      transform: translateY(-1px);
    }

    /* Updates Container Area */
    .news-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 10px 0;
    }

    /* Individual Update Card */
    .news-card {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 4px 4px 0px #F3EEDA;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-date {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      align-self: flex-start;
      border: 2px solid #111111;
    }

    .news-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #111111;
    }

    .news-desc {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.6;
      color: #333333;
    }

    .news-link-btn {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      text-align: center;
      border: 2px solid #111111;
      box-shadow: 3px 3px 0px #F3EEDA;
      align-self: flex-start;
      margin-top: 5px;
      transition: background 0.1s ease, transform 0.1s ease;
    }

    .news-link-btn:hover {
      background: #333333;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- Header with Home button -->
    <header class="top-banner">
      <h1>UPDATES</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" class="home-btn">&lt;- HOME</a>
    </header>

    <!-- Updates List -->
    <div class="news-container">

      <!-- Update Item -->
      <div class="news-card">
        <!-- Formato data: Giorno, Mese, Anno -->
        <span class="news-date">Monday, September 7, 2026</span>
        <h2 class="news-title">First Story Published: Solar Chat</h2>
        <p class="news-desc">I created the Stories section and published my very first story, Solar Chat.</p>
        <a href="https://seea-star.github.io/Cosmic-S-Stories/" class="news-link-btn">Go to Stories &rarr;</a>
      </div>

    </div>

  </div>

</body>
</html>
